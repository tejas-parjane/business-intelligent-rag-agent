services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: bi_rag
      POSTGRES_PASSWORD: bi_rag
      POSTGRES_DB: bi_rag
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build:
      context: .
      dockerfile: Dockerfile.semantic
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://bi_rag:bi_rag@db:5432/bi_rag
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      SEMANTIC_RETRIEVAL_ENABLED: ${SEMANTIC_RETRIEVAL_ENABLED:-false}
    volumes: [".:/app"]
    ports: ["8000:8000"]
    depends_on: [db]
  ui:
    build:
      context: .
      dockerfile: Dockerfile.semantic
    command: streamlit run ui.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_URL: http://api:8000
    volumes: [".:/app"]
    ports: ["8501:8501"]
    depends_on: [api]
volumes:
  pgdata:
